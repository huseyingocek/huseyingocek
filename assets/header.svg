<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Hüseyin Göçek — DevSecOps and Cloud Security</title>
  <desc id="desc">A midnight security console with cyan and magenta accents and an abstract network diagram. Decorative graphics do not represent live telemetry.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#182438" stroke-width="1"/></pattern>
    <linearGradient id="edge"><stop stop-color="#45f3d0"/><stop offset=".65" stop-color="#55baff"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#164451" stop-opacity=".65"/><stop offset="1" stop-color="#0b101b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="#0b101b" stroke="#283449"/>
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="url(#grid)"/>
  <ellipse cx="1000" cy="220" rx="280" ry="210" fill="url(#halo)"/>
  <path d="M32 1H1168" stroke="url(#edge)" stroke-width="3"/>
  <g font-family="ui-monospace, Consolas, monospace">
