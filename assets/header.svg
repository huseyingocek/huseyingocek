    <text x="1150" y="51" text-anchor="end" fill="#a2afc4" font-size="13">PROFILE CONSOLE / 01</text>
    <path d="M48 75H1152" stroke="#283449"/>
    <text x="48" y="132" fill="#a2afc4" font-size="15">&gt; whoami</text>
  </g>
  <text x="45" y="207" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="-2" fill="#f1f5fb">Hüseyin Göçek<tspan fill="#45f3d0">.</tspan></text>
  <text x="48" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c1ccdc">DevSecOps &amp; Cloud Security</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14">
    <text x="48" y="305" fill="#45f3d0" letter-spacing="2">NETWORKS</text>
    <text x="173" y="305" fill="#697a93">/</text>
    <text x="201" y="305" fill="#7cc9ff" letter-spacing="2">CLOUD</text>
