name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate SVG from GitHub contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: huseyingocek
          outputs: |
            assets/contribution-snake.svg?palette=github-dark&color_snake=%2345f3d0&color_dots=%23161f30,%23144549,%231d797b,%2333bab2,%2378f7dd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated contribution trace
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution snake"
          git push
